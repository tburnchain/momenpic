# ACVM Redis 7 — token buckets, distributed locks and Redis Streams event bus (§9.1).
# Streams are the event backbone: data must never be evicted → noeviction (writes fail loudly instead,
# alert RedisMemoryHigh fires at 85 %). The password is passed on the command line from REDIS_PASSWORD.

bind 0.0.0.0
protected-mode yes
port 6379
tcp-keepalive 60
timeout 0
databases 4

# durability: AOF every second + RDB preamble; snapshots as a second line of defence
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 128mb
save 900 1
save 300 100
save 60 10000
stop-writes-on-bgsave-error yes
dir /data

# memory
maxmemory 2gb
maxmemory-policy noeviction
stream-node-max-bytes 4096
stream-node-max-entries 100

# diagnostics
latency-monitor-threshold 100
slowlog-log-slower-than 10000
slowlog-max-len 256
loglevel notice
