# File-provisioned dashboards (deploy/grafana/dashboards/*.json, generated and reviewed in git).
# UI edits are not persisted — change the JSON and redeploy.
apiVersion: 1

providers:
  - name: acvm
    orgId: 1
    folder: ACVM
    folderUid: acvm
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
