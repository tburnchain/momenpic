# Alertmanager — routes severity=page (immediate) and severity=ticket (next working block).
# Webhook URLs are read from files so no secret sits in this repo or in env:
#   deploy/compose/secrets/alertmanager/page_webhook_url     Slack-compatible incoming webhook (Slack, Mattermost,
#   deploy/compose/secrets/alertmanager/ticket_webhook_url   or Discord with the /slack suffix)
global:
  resolve_timeout: 5m

route:
  receiver: ticket
  group_by: [alertname, platform, name, source, workspace]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 6h
  routes:
    - receiver: page
      matchers: ['severity="page"']
      group_wait: 10s
      group_interval: 2m
      repeat_interval: 1h
    - receiver: ticket
      matchers: ['severity="ticket"']

inhibit_rules:
  # a breaker stuck open (page) supersedes the "breaker open" ticket for the same breaker
  - source_matchers: ['alertname="ACVMCircuitBreakerStuckOpen"']
    target_matchers: ['alertname="ACVMCircuitBreakerOpen"']
    equal: [name]
  # an outage of the process explains its missing SLO data
  - source_matchers: ['alertname=~"ACVMApiDown|ACVMWorkerDown|TemporalDown|VaultSealedOrDown"']
    target_matchers: ['slo=~".+"']
  # budget exhausted supersedes "nearly exhausted"
  - source_matchers: ['alertname="ACVMBudgetExhausted"']
    target_matchers: ['alertname="ACVMBudgetNearlyExhausted"']
    equal: [workspace]

receivers:
  - name: page
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/page_webhook_url
        send_resolved: true
        title: '[ACVM PAGE] {{ .CommonLabels.alertname }} ({{ .Alerts.Firing | len }})'
        text: >-
          {{ range .Alerts }}• {{ .Annotations.summary }}{{ if .Annotations.runbook_url }} — {{ .Annotations.runbook_url }}{{ end }}
          {{ end }}
  - name: ticket
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/ticket_webhook_url
        send_resolved: true
        title: '[ACVM] {{ .CommonLabels.alertname }} ({{ .Alerts.Firing | len }})'
        text: >-
          {{ range .Alerts }}• {{ .Annotations.summary }}{{ if .Annotations.runbook_url }} — {{ .Annotations.runbook_url }}{{ end }}
          {{ end }}
