# OpenTelemetry Collector (contrib) — §9.1 관측성: "트레이스 단위로 명령 1건의 전 과정 추적".
#
#   apps ── OTLP (ACVM_OTEL_ENDPOINT=http://otel-collector:4318) ──▶ collector
#     metrics → Prometheus exporter :8889 (scraped by job "otel-collector"; /metrics endpoints are scraped directly too)
#     logs    → Loki native OTLP endpoint (container stdout also reaches Loki through promtail)
#     traces  → debug (sampled log lines) by default; Tempo is optional:
#               docker compose -f docker-compose.yml -f docker-compose.tracing.yml up -d
#               (adds tempo + merges deploy/otel/collector.tempo.yaml over this file)
#
# Sensitive attributes are dropped before export (§10: tokens never leave Vault — not even in spans).

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch:
    send_batch_size: 8192
    timeout: 5s
  resource:
    attributes:
      - key: deployment.environment
        value: ${env:DEPLOYMENT_ENV}
        action: upsert
      - key: service.namespace
        value: acvm
        action: upsert
  attributes/scrub:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.request.header.cf-access-jwt-assertion
        action: delete
      - key: http.response.header.set-cookie
        action: delete
      - key: url.query
        action: delete
      - key: http.url
        action: delete
      - key: access_token
        action: delete
      - key: client.address
        action: hash

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    send_timestamps: false
    metric_expiration: 10m
    resource_to_telemetry_conversion:
      enabled: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    compression: gzip
    retry_on_failure:
      enabled: true
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      queue_size: 5000
  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 1000

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
      encoding: json
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/scrub, resource, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/scrub, resource, batch]
      exporters: [otlphttp/loki]
