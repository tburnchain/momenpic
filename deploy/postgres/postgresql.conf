# ACVM PostgreSQL 16 — single-server P0/P1 profile.
# Sized for the compose memory limit of 10 GiB on a 12 vCPU / 48 GiB Contabo host (docs/DEPLOY.md §사양).
# Rule of thumb when resizing: shared_buffers = 25 % of the PG memory limit, effective_cache_size = 60 %.

# ── connections ──────────────────────────────────────────────────────────────
listen_addresses = '*'                 # private docker network only (no published port in prod)
port = 5432
max_connections = 300                  # 5 ACVM processes × (pool 10 + overflow 20) + Temporal + Grafana
superuser_reserved_connections = 5
password_encryption = scram-sha-256
idle_in_transaction_session_timeout = '60s'
tcp_keepalives_idle = 60

# ── memory ───────────────────────────────────────────────────────────────────
shared_buffers = '2560MB'
effective_cache_size = '6GB'
work_mem = '16MB'
maintenance_work_mem = '1GB'           # HNSW index builds are maintenance_work_mem bound
huge_pages = try

# ── WAL / checkpoints / archiving (WAL-G → R2) ──────────────────────────────
wal_level = replica
wal_compression = zstd
max_wal_size = '4GB'
min_wal_size = '1GB'
checkpoint_timeout = '15min'
checkpoint_completion_target = 0.9
archive_mode = on
archive_command = '/usr/local/bin/acvm-wal-archive %p'
archive_timeout = 300                  # force a segment switch ≤ 5 min → RPO ≪ 15 min
max_wal_senders = 3                    # wal-g backup-push uses a replication-protocol connection

# ── planner / parallelism (NVMe SSD) ─────────────────────────────────────────
random_page_cost = 1.1
effective_io_concurrency = 200
max_worker_processes = 12
max_parallel_workers = 8
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 4   # parallel HNSW build (pgvector ≥ 0.6)

# ── autovacuum (outbox / publication churn) ─────────────────────────────────
autovacuum_max_workers = 4
autovacuum_naptime = '30s'
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 2000

# ── observability ────────────────────────────────────────────────────────────
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top
pg_stat_statements.max = 5000
track_io_timing = on
log_destination = 'stderr'
logging_collector = off                # docker json-file → promtail → Loki
log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = 500
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = '1s'
log_connections = off
log_disconnections = off

# ── locale ───────────────────────────────────────────────────────────────────
timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.simple'
