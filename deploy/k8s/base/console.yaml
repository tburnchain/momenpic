# Next.js operator console (image built from console/Dockerfile). Reached only through cloudflared + Access.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: acvm-console
  labels: {app.kubernetes.io/name: acvm-console, acvm.io/tier: web}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app.kubernetes.io/name: acvm-console}
  template:
    metadata:
      labels: {app.kubernetes.io/name: acvm-console, acvm.io/tier: web}
    spec:
      serviceAccountName: acvm-console
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: console
          image: acvm-console
          ports:
            - {name: http, containerPort: 3000}
          env:
            - {name: NODE_ENV, value: production}
            - {name: PORT, value: "3000"}
            - {name: HOSTNAME, value: 0.0.0.0}
            - {name: ACVM_API_URL, value: "http://acvm-api:8000"}
            - {name: NEXT_TELEMETRY_DISABLED, value: "1"}
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: next-cache, mountPath: /app/.next/cache}
      volumes:
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 128Mi}
        - name: next-cache
          emptyDir: {sizeLimit: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: acvm-console
  labels: {app.kubernetes.io/name: acvm-console}
spec:
  selector: {app.kubernetes.io/name: acvm-console}
  ports:
    - {name: http, port: 3000, targetPort: http}
