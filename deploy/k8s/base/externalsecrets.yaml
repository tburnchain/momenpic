# External Secrets Operator pulls deployment credentials from Vault (KV v2 mount "acvm-k8s") into Secrets.
# Application secrets (Coupang keys, social tokens, R2 keys, link signing key) are NOT synced: pods read them
# from Vault at run time with their own 5-minute AppRole tokens (§10), exactly as in compose.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-acvm
spec:
  provider:
    vault:
      server: http://vault.acvm-data.svc:8200
      path: acvm-k8s
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-acvm
          serviceAccountRef:
            name: acvm-eso
---
# DSNs + LLM key shared by every ACVM process
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: acvm-runtime
spec:
  refreshInterval: 1h
  secretStoreRef: {name: vault-acvm, kind: SecretStore}
  target: {name: acvm-runtime, creationPolicy: Owner}
  data:
    - secretKey: ACVM_DATABASE_URL
      remoteRef: {key: runtime, property: database_url}
    - secretKey: ACVM_REDIS_URL
      remoteRef: {key: runtime, property: redis_url}
    - secretKey: ACVM_CLICKHOUSE_URL
      remoteRef: {key: runtime, property: clickhouse_url}
    - secretKey: ANTHROPIC_API_KEY
      remoteRef: {key: runtime, property: anthropic_api_key}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: acvm-approle-api
spec:
  refreshInterval: 1h
  secretStoreRef: {name: vault-acvm, kind: SecretStore}
  target: {name: acvm-approle-api, creationPolicy: Owner}
  data:
    - secretKey: ACVM_VAULT_ROLE_ID
      remoteRef: {key: approle/acvm-api, property: role_id}
    - secretKey: ACVM_VAULT_SECRET_ID
      remoteRef: {key: approle/acvm-api, property: secret_id}
---
