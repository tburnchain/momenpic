# One identity per process class (mirrors the Vault AppRoles). No Kubernetes API access is needed by ACVM,
# so token automount is off everywhere except the External Secrets service account.
apiVersion: v1
kind: ServiceAccount
metadata: {name: acvm-api}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: acvm-worker}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: acvm-publisher}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: acvm-render}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: acvm-loops}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: acvm-migrate}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: acvm-console}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: cloudflared}
automountServiceAccountToken: false
---
# used by the SecretStore's Vault Kubernetes-auth login (Vault role "eso-acvm" → read acvm-k8s/*)
apiVersion: v1
kind: ServiceAccount
metadata: {name: acvm-eso}
