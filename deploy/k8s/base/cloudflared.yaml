# Cloudflare Tunnel connectors (2 replicas = 2 connections per tunnel). The only ingress into the namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  labels: {app.kubernetes.io/name: cloudflared, acvm.io/tier: edge}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: cloudflared}
  template:
    metadata:
      labels: {app.kubernetes.io/name: cloudflared, acvm.io/tier: edge}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "2000"
    spec:
      serviceAccountName: cloudflared
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: cloudflared
          image: cloudflared
          args: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config/config.yml", "run"]
          ports:
            - {name: metrics, containerPort: 2000}
          livenessProbe:
            httpGet: {path: /ready, port: metrics}
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/cloudflared/config, readOnly: true}
            - {name: creds, mountPath: /etc/cloudflared/creds, readOnly: true}
      volumes:
        - name: config
          configMap: {name: cloudflared-config}
        - name: creds
          secret: {secretName: cloudflared-credentials}
