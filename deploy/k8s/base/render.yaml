# acvm-render — Temporal worker on task queue acvm-render (ffmpeg + Noto CJK). M6 target: 30 s video ≤ 60 s CPU,
# 8 concurrent renders per pod (ACVM_RENDER__CONCURRENCY) → one pod per 8 backlog items, up to 4 pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: acvm-render
  labels: {app.kubernetes.io/name: acvm-render, acvm.io/tier: app}
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app.kubernetes.io/name: acvm-render}
  template:
    metadata:
      labels: {app.kubernetes.io/name: acvm-render, acvm.io/tier: app, acvm.io/egress: internet}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
    spec:
      serviceAccountName: acvm-render
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 300   # a render must not be killed half-way
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: render
          image: acvm-render
          command: ["python", "-m", "acvm.orchestration.worker", "--queue", "acvm-render"]
          ports:
            - {name: metrics, containerPort: 9464}
          envFrom:
            - configMapRef: {name: acvm-config}
            - secretRef: {name: acvm-runtime}
            - secretRef: {name: acvm-approle-render}
          env:
            - {name: OTEL_SERVICE_NAME, value: acvm-render}
            - {name: ACVM_TEMPORAL_TASK_QUEUE, value: acvm-render}
          livenessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests: {cpu: "2", memory: 3Gi}
            limits: {cpu: "6", memory: 8Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: var, mountPath: /app/var}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 4Gi}
        - name: var
          emptyDir: {sizeLimit: 10Gi}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: acvm-render
spec:
  scaleTargetRef: {name: acvm-render}
  minReplicaCount: 1
  maxReplicaCount: 4
  pollingInterval: 15
  cooldownPeriod: 600
  fallback: {failureThreshold: 3, replicas: 2}
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc:9090
        query: sum(approximate_backlog_count{namespace="acvm", taskqueue="acvm-render"}) or vector(0)
        threshold: "8"
