# cloudflared ingress for the cluster (hostnames are replaced in overlays/prod). Same policy as compose:
# public = link hub only; console + /api/v1 + Grafana behind Cloudflare Access, re-validated by cloudflared.
tunnel: 00000000-0000-0000-0000-000000000000
credentials-file: /etc/cloudflared/creds/credentials.json
metrics: 0.0.0.0:2000
no-autoupdate: true
ingress:
  - hostname: go.example.com
    path: ^/(hub|r)/
    service: http://acvm-api.acvm.svc:8000
  - hostname: go.example.com
    service: http_status:404
  - hostname: console.example.com
    path: ^/api/v1/
    service: http://acvm-api.acvm.svc:8000
    originRequest:
      access: {required: true, teamName: example, audTag: ["console-aud"]}
  - hostname: console.example.com
    service: http://acvm-console.acvm.svc:3000
    originRequest:
      access: {required: true, teamName: example, audTag: ["console-aud"]}
  - hostname: grafana.example.com
    service: http://grafana.monitoring.svc:80
    originRequest:
      access: {required: true, teamName: example, audTag: ["grafana-aud"]}
  - service: http_status:404
