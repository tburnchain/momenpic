# §10 공급망: weekly dependency + base-image + action updates (security updates arrive immediately).
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly, day: monday, time: "06:00", timezone: Asia/Seoul}
    open-pull-requests-limit: 10
    groups:
      python-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /console
    schedule: {interval: weekly, day: monday, time: "06:00", timezone: Asia/Seoul}
    groups:
      console-minor:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/deploy/docker, /deploy/postgres]
    schedule: {interval: weekly}
  - package-ecosystem: docker-compose
    directory: /deploy/compose
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions:
        patterns: ["*"]
