# Alembic configuration for the ACVM transactional schema (PostgreSQL 16 + pgvector; SQLite in dev/tests).
#
# The database URL is NOT stored here. env.py resolves it in this order:
#   1. `alembic -x url=...`            (one-off override)
#   2. sqlalchemy.url below            (left empty on purpose; programmatic callers set it)
#   3. ACVM_DATABASE_URL               (same variable the application uses)
#   4. acvm.config.Settings default    (sqlite+aiosqlite:///./var/acvm.db)
#
# script_location is a package resource so it resolves both from a source checkout (`uv run alembic ...`)
# and inside the container image, where the package is installed non-editable into /app/.venv.

[alembic]
script_location = acvm.db:migrations
prepend_sys_path = src
path_separator = os
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC
sqlalchemy.url =

[post_write_hooks]
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
